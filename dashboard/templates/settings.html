{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}

{% block content %}
<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);align-items:start">

  <!-- STATUS -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        System Status
      </div>
    </div>
    <div style="padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-3)">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="status-row" style="margin:0"><span class="status-dot" id="s-snort"></span> Snort</div>
        <button class="pill-btn" id="btnRestartSnort">Restart Snort</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="status-row" style="margin:0"><span class="status-dot" id="s-parser"></span> ids-parser.service</div>
        <button class="pill-btn" id="btnRestartParser">Restart Parser</button>
      </div>
      <div id="restartMsg" style="font-size:var(--text-xs);font-family:var(--font-mono);color:var(--text-muted);min-height:16px"></div>
      <div style="border-top:1px solid var(--border);padding-top:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)" id="pathInfo"></div>
      <div style="font-size:var(--text-xs);color:var(--text-muted);font-family:var(--font-mono);padding-top:var(--space-2);border-top:1px solid var(--border)" id="lastLog"></div>
    </div>
  </div>

  <!-- CONFIG EDITOR -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        config.ini
      </div>
      <button class="pill-btn" id="btnSaveConfig" style="padding:3px var(--space-4)">Save</button>
    </div>
    <div id="configForm" style="padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)"></div>
    <div id="saveMsg" style="padding:0 var(--space-5) var(--space-3);font-size:var(--text-xs);font-family:var(--font-mono);color:var(--success);min-height:20px"></div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/settings.js"></script>
{% endblock %}
