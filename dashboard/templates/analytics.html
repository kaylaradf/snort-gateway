{% extends "base.html" %}
{% block title %}Analytics{% endblock %}
{% block page_title %}Analytics{% endblock %}

{% block content %}
<!-- RANGE SELECTOR -->
<div style="display:flex;gap:var(--space-2);align-items:center">
  <span style="font-size:var(--text-xs);color:var(--text-muted);font-family:var(--font-ui);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Range:</span>
  <div class="panel-actions" id="rangeButtons">
    <button class="pill-btn active" data-r="1h">1H</button>
    <button class="pill-btn" data-r="6h">6H</button>
    <button class="pill-btn" data-r="24h">24H</button>
    <button class="pill-btn" data-r="7d">7D</button>
    <button class="pill-btn" data-r="30d">30D</button>
  </div>
</div>

<!-- TIMELINE -->
<div class="panel">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Alert Volume Over Time
    </div>
  </div>
  <div class="panel-body">
    <div class="chart-wrap" style="height:200px"><canvas id="timelineChart"></canvas></div>
  </div>
</div>

<!-- CHARTS ROW -->
<div class="charts-row">
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg>
        Top Attacker IPs
      </div>
    </div>
    <div class="panel-body">
      <div class="chart-wrap" style="height:200px"><canvas id="ipChart"></canvas></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        By Category
      </div>
    </div>
    <div class="donut-wrap">
      <div class="donut-chart-area">
        <canvas id="donutChart" style="max-height:130px;max-width:130px;"></canvas>
        <div class="donut-center">
          <div class="donut-center-val" id="donutTotal">—</div>
          <div class="donut-center-lbl">alerts</div>
        </div>
      </div>
      <div class="legend-list" id="donutLegend"></div>
    </div>
  </div>
</div>

<!-- PROTOCOL -->
<div class="panel" style="max-width:400px">
  <div class="panel-header">
    <div class="panel-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      By Protocol
    </div>
  </div>
  <div class="ip-list" id="protoList"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/analytics.js"></script>
{% endblock %}
